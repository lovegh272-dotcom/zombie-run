<script>
// v53: เก็บรูปทุกรูปที่สร้าง เพื่อถอดรหัสล่วงหน้า (กันเฟรมสะดุดตอนรูปถูกวาดครั้งแรก)
const ALLIMG=[];{const _I=window.Image;window.Image=function(w,h){const i=new _I(w,h);ALLIMG.push(i);return i};window.Image.prototype=_I.prototype}
const WARMC=document.createElement('canvas');WARMC.width=WARMC.height=2;const WARMX=WARMC.getContext('2d');let warmI=0;
function warmImgs(all){let n=0;for(;warmI<ALLIMG.length;warmI++){const im=ALLIMG[warmI];if(!im.complete){if(all)continue;break}if(im.naturalWidth){try{WARMX.drawImage(im,0,0,2,2)}catch(e){}}if(!all&&++n>=8){warmI++;break}}}
setInterval(()=>{if(typeof state==='undefined'||state!=='play')warmImgs(false)},60);
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const DPR0=Math.min(devicePixelRatio||1,2);let W_,H_,DPR=DPR0;
function resize(){W_=innerWidth;H_=innerHeight;cv.width=Math.round(W_*DPR);cv.height=Math.round(H_*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
function applyDPR(){const n=lowQ?Math.min(DPR0,1.25):DPR0;if(n!==DPR){DPR=n;resize()}}
addEventListener('resize',()=>{resize();if(innerHeight>innerWidth&&state==='play')togglePause()});resize();
// v59: iPhone บางครั้งรายงานขนาดจอผิดตอนเปิดแอป/หมุนจอ แล้วไม่แจ้งซ้ำ → ภาพยืด จึงวัดซ้ำหลายจังหวะ + เช็กเป็นระยะ
function fixSize(){const w=innerWidth,h=innerHeight;if(w&&h&&(w!==W_||h!==H_||cv.width!==Math.round(w*DPR)||cv.height!==Math.round(h*DPR)))resize()}
function fixSizeSoon(){fixSize();setTimeout(fixSize,150);setTimeout(fixSize,350);setTimeout(fixSize,800)}
addEventListener('orientationchange',fixSizeSoon);addEventListener('pageshow',fixSizeSoon);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fixSizeSoon()});
if(window.visualViewport)visualViewport.addEventListener('resize',fixSizeSoon);
setInterval(fixSize,500);
function lockLand(){try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}

const BOSS_EVERY=120;

// ---------- PWA ----------
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// ---------- Save data ----------
function defSave(){return{coins:0,up:{},chars:['soldier'],sel:'soldier',ach:{},maps:['forest','deadport','darkgrave'],map:'forest',diff:'normal',mode:'endless',
  q:'auto',fps:false,dh:[],lb:[],st:{kills:0,boss:0,games:0,best:0,coins:0,wins:0},custom:{maps:{},chars:{}}}}

function loadSave(){
  const d=defSave();
  try{const s=JSON.parse(localStorage.zsave||'{}');
    Object.assign(d,s);d.st=Object.assign(defSave().st,s.st||{});d.up=s.up||{};d.ach=s.ach||{};
    if(!d.chars||!d.chars.length)d.chars=['soldier'];
    if(!d.maps||!d.maps.length)d.maps=['forest'];
    d.lb=Array.isArray(s.lb)?s.lb:[];
d.custom={maps:(s.custom&&s.custom.maps)||{},chars:(s.custom&&s.custom.chars)||{}};
    d.dh=Array.from({length:30},(_,i)=>+(s.dh&&s.dh[i])||0);
  }catch(e){}
  if(d.dh.length!==30)d.dh=Array(30).fill(0);
  d.st.best=Math.max(d.st.best||0,+localStorage.zbest||0);
  return d;
}
let S=loadSave();
function save(){try{localStorage.zsave=JSON.stringify(S)}catch(e){}
}
const lvOf=id=>S.up[id]||0;

// ---------- Maps / Difficulty / Modes ----------

function dayKey(off){const d=new Date(Date.now()+7*3600e3-(off||0)*864e5);return d.toISOString().slice(0,10)}
function dailyCfg(){
  const k=dayKey();let h=2166136261;for(let i=0;i<k.length;i++){h^=k.charCodeAt(i);h=Math.imul(h,16777619)}
  let a=h>>>0;const rnd=()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};
  const maps=Object.keys(MAPS).filter(id=>!MAPS[id].hidden&&!(S.custom&&S.custom.maps&&S.custom.maps[id])).sort();
  return{date:k,map:maps[Math.floor(rnd()*maps.length)],bad:DRULES_BAD[Math.floor(rnd()*DRULES_BAD.length)],good:DRULES_GOOD[Math.floor(rnd()*DRULES_GOOD.length)]};
}

function rnd(cx,cy,k){let h=(cx*374761393+cy*668265263+(k+M.seed*131)*1274126177)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}

function pushOut(e,r){

// ---------- Custom content (ด่าน/ตัวละครที่ AI สร้าง) ----------
const ALLOW=['normal','fast','tank','boom','spit','split','mini','screamer','shield','healer','necromancer'];
const clamp=(v,a,b,d)=>{v=+v;return isFinite(v)?Math.min(b,Math.max(a,v)):d};
const clean=(s,n)=>String(s==null?'':s).replace(/[<>&"'`\\]/g,'').trim().slice(0,n);
const hex=(s,d)=>/^#[0-9a-f]{6}$/i.test(s)?s:d;
const emo=(s,d)=>clean(Array.from(String(s||'')).slice(0,4).join(''),8)||d;

function sanMap(o){
  if(!o||typeof o!=='object')return null;
  const rmin=clamp(o.rmin,14,30,22);
  const em=(Array.isArray(o.em)?o.em:[]).slice(0,4).map(e=>emo(e,'🪨'));
  const bias=(Array.isArray(o.bias)?o.bias:[]).filter(t=>ALLOW.includes(t)).slice(0,4);
  return{n:clean(o.n,24)||'ด่านใหม่',ic:emo(o.ic,'🗺️'),d:clean(o.d,80),price:0,
    seed:Math.floor(clamp(o.seed,1,9999,7)),
    bg:hex(o.bg,'#222222'),grid:hex(o.grid,'#2e2e2e'),ob:hex(o.ob,'#111111'),
    em:em.length?em:['🪨'],dens:Math.round(clamp(o.dens,0,4,2)),
    rmin,rmax:clamp(o.rmax,rmin,50,rmin+10),
    bias:bias.length?bias:null,bp:bias.length?clamp(o.bp,0,.4,.15):0};
}
function sanChar(o){
  if(!o||typeof o!=='object')return{err:'ข้อมูลไม่ถูกต้อง'};
  const w=['blade','nade','ltn','sg'].includes(o.start)?o.start:null;
  const c={n:clean(o.n,20)||'ตัวละครใหม่',ic:emo(o.ic,'🧑'),d:clean(o.d,80),price:0,
    hp:clamp(o.hp,.6,1.5,1),dmg:clamp(o.dmg,.6,1.6,1),rate:clamp(o.rate,.6,1.5,1),
    spd:clamp(o.spd,.85,1.15,1),range:clamp(o.range,.8,1.6,1),
    pierce:Math.round(clamp(o.pierce,0,2,0)),blade:0,nade:0,ltn:0,sg:0,
    col:hex(o.col,'#3a8cff'),start:w};
  if(w)c[w]=1;
  const sc=(c.hp-1)+(c.dmg-1)+(c.rate-1)+2*(c.spd-1)+.5*(c.range-1)+(w?.15:0)+.1*c.pierce;
  if(sc>.4)return{err:c.n+' เก่งเกินไป (คะแนนพลัง '+sc.toFixed(2)+' เกิน 0.4)'};
  return{ok:c};
}

}

  const s=txt.replace(/```[a-z]*/gi,''),a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a<0||b<a)return'ไม่พบข้อมูล JSON';
  let o;try{o=JSON.parse(s.slice(a,b+1))}catch(e){return'JSON ผิดรูปแบบ: '+e.message}

const SPR=new Map();
function shade(h,a){
  if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];
  const n=parseInt(h.slice(1),16),cl=v=>Math.max(0,Math.min(255,v));
  return 'rgb('+cl((n>>16)+a)+','+cl(((n>>8)&255)+a)+','+cl((n&255)+a)+')';
}
function spr(T,col,fr){
  const key=T.r+'|'+col+'|'+fr+'|'+(T.kind||T.xp);
  let s=SPR.get(key);if(s)return s;
  const r=T.r,sz=Math.ceil(r*3.4),c=document.createElement('canvas');
  c.width=c.height=sz*2;
  const x=c.getContext('2d');x.scale(2,2);x.translate(sz/2,sz/2);x.lineCap='round';
  const sw=fr?1:-1;
  // แขน (หันไปทางขวา = ทิศที่ซอมบี้เดินไปหาผู้เล่น)
  for(const sd of[-1,1]){
    const reach=r*(1.1+(sd===sw?.3:0));
    x.strokeStyle=shade(col,-15);x.lineWidth=r*.34;
    x.beginPath();x.moveTo(r*.1,sd*r*.72);x.lineTo(reach,sd*r*.5);x.stroke();
    x.fillStyle=shade(col,-35);x.beginPath();x.arc(reach,sd*r*.5,r*.19,0,6.28);x.fill();
  }
  // ลำตัว
  x.fillStyle=shade(col,-35);x.strokeStyle='rgba(0,0,0,.4)';x.lineWidth=1;
  x.beginPath();x.ellipse(-r*.1,0,r*.62,r*.98,0,0,6.28);x.fill();x.stroke();
  if(T.xp===6&&!T.kind){x.fillStyle=shade(col,-60);for(const sd of[-1,1]){x.beginPath();x.arc(0,sd*r*.85,r*.3,0,6.28);x.fill()}}
  if(T.kind==='boom'){x.fillStyle='#c22';x.fillRect(-r*.8,-r*.35,r*.42,r*.7);x.strokeStyle='#fb0';x.lineWidth=2;x.beginPath();x.arc(0,0,r*1.08,0,6.28);x.stroke()}
  // หัว
  x.fillStyle=col;x.strokeStyle='rgba(0,0,0,.4)';x.lineWidth=1;
  x.beginPath();x.arc(r*.2,0,r*.62,0,6.28);x.fill();x.stroke();
  if(T.kind==='boss'){x.fillStyle='#eee';for(const sd of[-1,1]){x.beginPath();x.moveTo(r*.25,sd*r*.4);x.lineTo(r*.95,sd*r*.75);x.lineTo(r*.6,sd*r*.15);x.fill()}}
  if(T.kind==='spit'){x.fillStyle='#bfa';x.beginPath();x.arc(r*.72,0,r*.2,0,6.28);x.fill()}
  // ตา
  x.fillStyle='#e22';
  for(const sd of[-1,1]){x.beginPath();x.arc(r*.58,sd*r*.26,r*.15,0,6.28);x.fill()}
  s={c,sz};SPR.set(key,s);return s;
}

function makeExtraction(){
  const parts=[],firstAngle=-Math.PI/2+(M.seed%8)*Math.PI/16;
  for(let i=0;i<3;i++){
    const angle=firstAngle+i*Math.PI*2/3;
    let x,y;
    for(let r=680;r<=1100;r+=70){
      x=Math.cos(angle)*r;y=Math.sin(angle)*r;
      const cx=Math.floor(x/CS),cy=Math.floor(y/CS);
      let clear=true;
      for(let dx=-1;dx<=1&&clear;dx++)for(let dy=-1;dy<=1&&clear;dy++){
        for(const o of chunk(cx+dx,cy+dy)){
          if(Math.hypot(x-o.x,y-o.y)<o.r+45){clear=false;break}
        }
      }
      if(clear)break;
    }
    parts.push({x,y,readyAt:20+i*70,progress:0});
  }
  return{parts,count:0,phase:'parts',base:{x:0,y:0},radius:120,defend:45};
}
function updateExtraction(dt){
  const ex=G.ex;if(!ex)return false;
  const baseDistance=Math.hypot(P.x-ex.base.x,P.y-ex.base.y);
  if(ex.jam>0)ex.jam-=dt;ex.jt=(ex.jt||75)-dt;if(ex.jt<=0&&ex.phase!=='defend'){ex.jt=70+Math.random()*30;ex.jam=12;G.ban={s:'📻 สัญญาณวิทยุถูกรบกวน! ลูกศรนำทางหาย 12 วิ',t:2.5};sfx('event')}
  if(ex.phase==='parts'&&ex.count<ex.parts.length){
    const part=ex.parts[ex.count];
    if(G.t>=part.readyAt&&!part.gs){part.gs=1;const z=mkZ(Math.random()<.5?'tank':'shield',part.x+40,part.y+30,1+G.t/90);if(z){if(typeof setAfx==='function')setAfx(z);z.hp*=2.2;z.max=z.hp;part.g=z;G.ban={s:'👹 หัวหน้าซอมบี้เฝ้าอะไหล่วิทยุ! ฆ่าก่อนถึงจะเก็บได้',t:3};sfx('zgroan_big')}}
    if(part.g&&part.g.hp<=0){part.g=null;G.ban={s:'✅ ล้มตัวเฝ้าแล้ว! ไปเก็บอะไหล่',t:2}}
    if(G.t>=part.readyAt&&!part.g){
      if(Math.hypot(P.x-part.x,P.y-part.y)<48){
        part.progress+=dt;
        if(part.progress>=1.25){
          ex.count++;sfx('pickup');burst(part.x,part.y,'#6cf',18);
          G.ban={s:'📡 ได้อะไหล่วิทยุ '+ex.count+'/3',t:2.5};
          if(ex.count===ex.parts.length){
            ex.phase='return';
            G.ban={s:'🚁 เก็บครบแล้ว! กลับจุดอพยพ',t:3};
          }
        }
      }else part.progress=0;
    }
  }else if(ex.phase==='return'&&baseDistance<ex.radius){
    ex.phase='defend';G.ban={s:'🛡️ ป้องกันจุดอพยพ 45 วินาที!',t:3};sfx('boss');
  }
  if(ex.phase==='defend'&&baseDistance<ex.radius){
    ex.defend=Math.max(0,ex.defend-dt);
    if(ex.defend<=0){gameOver(true);return true}
  }
  return false;
}

function edgeArrow(tx,ty,icon,col){
  const dx=tx-P.x,dy=ty-P.y,dist=Math.hypot(dx,dy),a=Math.atan2(dy,dx),mg=34;
  const sc=Math.min((W_/2-mg)/Math.max(1,Math.abs(dx)),(H_/2-mg)/Math.max(1,Math.abs(dy)));
  if(sc>=1)return;
  const x=W_/2+dx*sc,y=H_/2+dy*sc;
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  ctx.fillStyle='#071018';ctx.beginPath();ctx.arc(0,0,23,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-11);ctx.lineTo(-10,11);ctx.closePath();ctx.fill();
  ctx.rotate(-a);ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText(icon,0,6);
  ctx.font='bold 11px sans-serif';ctx.fillStyle='#fff';ctx.fillText(Math.round(dist/10)+' ม.',0,36);
  ctx.restore();
}

function restoreSave(txt){
  txt=String(txt||'').trim();
  if(txt.indexOf('ZRUN1:')!==0)return'รูปแบบไม่ถูกต้อง';
  let o;try{o=JSON.parse(decodeURIComponent(escape(atob(txt.slice(6)))))}catch(e){return'อ่านข้อมูลไม่ได้'}
  if(!o||typeof o!=='object'||typeof o.coins!=='number')return'ข้อมูลนี้ไม่ใช่เซฟของเกมนี้';
  try{localStorage.zsave=JSON.stringify(o)}catch(e){return'บันทึกไม่ได้'}
  return null;
}

    ctx.fillText('Z:'+Z.length+'/'+MAX_Z+' FX:'+FX.length+'+'+G.fxl.length+' PT:'+PART.length+' TX:'+TXT.length+' DC:'+DECALS.length+' B:'+B.length+' | '+(lowQ?'LOW':'HIGH')+' x'+DPR,10,H_-10)}
  SK.forEach((s,i)=>{const el=document.getElementById('s'+i);
    el.classList.toggle('ready',s.t<=0);
    el.querySelector('.cd').style.height=(s.t>0?100*s.t/(s.cd*G.cdMul):0)+'%'});
}
// [เพิ่มใหม่] ฟังก์ชันสำหรับวาดลูกศรชี้ไปยังจุด Quest ถ้านอกจอ
function drawQuestArrow(){
  if (!G.quest || !G.quest.active) return;
  const dx = G.quest.x - P.x, dy = G.quest.y - P.y, dist = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx), margin = 34;
  const scale = Math.min((W_/2-margin)/Math.max(1,Math.abs(dx)), (H_/2-margin)/Math.max(1,Math.abs(dy)));
  if (scale >= 1) return; // จุดเควสอยู่ในหน้าจอแล้ว
  
  const x = W_/2 + dx * scale, y = H_/2 + dy * scale;
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = '#071018'; ctx.beginPath(); ctx.arc(0, 0, 23, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#fd4'; ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -11); ctx.lineTo(-10, 11); ctx.closePath(); ctx.fill();
  ctx.rotate(-a); ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('📍', 0, 6);
  ctx.font = 'bold 11px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(Math.round(dist)+'m', 0, 36);
  ctx.restore();
}

function drawExtractionArrow(){
  const ex=G.ex;if(ex.jam>0){ctx.save();ctx.textAlign='center';ctx.font='bold 15px sans-serif';ctx.fillStyle=Math.sin(G.t*10)>0?'#f86':'#fff';ctx.strokeStyle='#000';ctx.lineWidth=4;const t='📻 สัญญาณถูกรบกวน! ('+Math.ceil(ex.jam)+')';ctx.strokeText(t,W_/2,96);ctx.fillText(t,W_/2,96);ctx.restore();return}
  let target,icon;
  if(ex.phase==='parts'&&G.t>=ex.parts[ex.count].readyAt){
    target=ex.parts[ex.count];icon='📡';
  }else if(ex.phase==='return'||ex.phase==='defend'){
    target=ex.base;icon='🚁';
  }else return;
  const dx=target.x-P.x,dy=target.y-P.y,dist=Math.hypot(dx,dy);
  const a=Math.atan2(dy,dx),margin=34;
  const scale=Math.min((W_/2-margin)/Math.max(1,Math.abs(dx)),(H_/2-margin)/Math.max(1,Math.abs(dy)));
  if(scale>=1)return;
  const x=W_/2+dx*scale,y=H_/2+dy*scale;
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  ctx.fillStyle='#071018';ctx.beginPath();ctx.arc(0,0,23,0,6.28);ctx.fill();
  ctx.fillStyle='#6cf';ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-11);ctx.lineTo(-10,11);ctx.closePath();ctx.fill();
  ctx.rotate(-a);ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText(icon,0,6);
  ctx.font='bold 11px sans-serif';ctx.fillStyle='#fff';ctx.fillText(Math.round(dist/10)+' ม.',0,36);
  ctx.restore();
}
// ---------- Perf logger (v15): เก็บค่าประสิทธิภาพอัตโนมัติทุกรอบ ลง localStorage ----------
const PERF_KEY='zperf';
let PR=null,fu=0,fd=0,pfu=0,pfd=0;
const pa={n:0,fps:999,avg:0,max:0,up:0,dr:0};
function r1(x){return Math.round(x*10)/10}
function perfLoad(){try{return JSON.parse(localStorage[PERF_KEY]||'[]')}catch(e){return[]}}
function perfSave(){
  if(!PR)return;
  try{const a=perfLoad().filter(r=>r.id!==PR.id);a.push(PR);while(a.length>5)a.shift();localStorage[PERF_KEY]=JSON.stringify(a)}catch(e){}
}
function perfStart(){
  try{PR={id:Date.now(),ch:S.sel,map:(M&&M.n)||'',df:(D&&D.n)||'',mo:(MO&&MO.n)||'',mob:MOB?1:0,dpr:DPR0,vp:innerWidth+'x'+innerHeight,zb:Z_BASE,
    ua:navigator.userAgent.slice(0,100),rows:[],sp:[],end:0}}catch(e){PR=null}
  pa.n=0;pa.fps=999;pa.avg=pa.max=pa.up=pa.dr=0;pfu=pfd=0;
}
// เรียกทุก 1 วินาทีของเกม: รวม 5 วินาทีเป็น 1 แถว
function perfTick(){
  pa.n++;pa.fps=Math.min(pa.fps,fps);pa.avg+=avgMs;pa.max=Math.max(pa.max,lastPeakFrameMs);pa.up+=upMs;pa.dr+=drMs;
  if(pa.n>=5){
    if(PR&&PR.rows.length<240){
      PR.rows.push([Math.floor(G.t),pa.fps,r1(pa.avg/5),Math.round(pa.max),r1(pa.up/5),r1(pa.dr/5),Z.length,MAX_Z,FX.length+G.fxl.length,PART.length,TXT.length,DECALS.length,lowQ?1:0,EB.length,B.length,perfFlags()]);
      if(PR.rows.length%4===0)perfSave();
    }
    pa.n=0;pa.fps=999;pa.avg=pa.max=pa.up=pa.dr=0;
  }
}
// เฟรมสะดุด (>45ms): จดว่าเฟรมก่อนหน้าใช้ update/draw กี่ ms และบนจอมีอะไร (B=บอส U=ULT + ชื่ออีเวนต์)
// ถ้า ms สูงแต่ upd+drw ต่ำ แปลว่าคอขวดอยู่นอก JS (GPU/ระบบ)
// v47: ป้ายสถานะ D=ในดันเจี้ยน B=มีบอส C=มีคู่หู Fn=สูตรผสม En=วิวัฒนาการ U=ULT
function perfFlags(){try{const f=Object.keys(G.fus||{}).filter(k=>G.fus[k]).length;return[G.inDun?'D':'',G.boss?'B':'',G.comp?'C':'',f?'F'+f:'',G.evoN?'E'+G.evoN:'',(G.ult&&G.ult.t>0)?'U':''].filter(Boolean).join('')||'-'}catch(e){return'-'}}
function perfSpike(jf){
  if(PR&&jf>34&&jf<500&&PR.sp.length<40)
    PR.sp.push([Math.floor(G.t),Math.round(jf),r1(pfu),r1(pfd),Z.length,FX.length+G.fxl.length,PART.length,[perfFlags(),necroCnt()?'N':'',G.ev||'','eb'+EB.length,'b'+B.length].filter(Boolean).join('+')]);
  pfu=fu;pfd=fd;
}
function perfReport(n){
  const a=perfLoad().slice(-(n||3));
  if(!a.length)return 'ยังไม่มีข้อมูล เล่นสัก 1 รอบก่อน';
  let o='ZRUN-PERF v87 (เกม v87) (แสดง '+a.length+' รอบล่าสุด)\n';
  a.forEach((r,i)=>{
    o+='\n=== RUN '+(i+1)+' '+r.ch+' | '+r.map+' | '+r.df+' | '+r.mo+' | mob'+r.mob+' dpr'+r.dpr+' vp'+r.vp+' zbase'+r.zb+' | จบที่ '+r.end+'s'+(r.dun!==undefined?' | เข้าดันเจี้ยนที่ '+r.dun+'s':'')+'\n'+r.ua+'\n';
    const mins={};r.rows.forEach(w=>{const m=Math.floor(w[0]/60);(mins[m]=mins[m]||[]).push(w)});
    o+='[สรุปรายนาที] นาที: avg_ms / max_ms / min_fps / upd / drw / Zสูงสุด / capต่ำสุด / คุณภาพ\n';
    Object.keys(mins).forEach(m=>{
      const w=mins[m],n2=w.length,av=x=>w.reduce((t,q)=>t+q[x],0)/n2;
      o+=m+': '+av(2).toFixed(1)+' / '+Math.max(...w.map(q=>q[3]))+' / '+Math.min(...w.map(q=>q[1]))+' / '+av(4).toFixed(1)+' / '+av(5).toFixed(1)+' / '+Math.max(...w.map(q=>q[6]))+' / '+Math.min(...w.map(q=>q[7]))+' / '+(w.some(q=>q[12])?'LOW':'HIGH')+'\n';
    });
    o+='[แถวทุก 5 วินาที] t,fps,avg,max,upd,drw,Z,cap,fx,pt,tx,dc,low,eb,b,flags\n'+r.rows.map(w=>w.join(',')).join('\n')+'\n';
    o+='[เฟรมสะดุด n='+r.sp.length+'] t,ms,upd,drw,Z,fx,pt,flags\n'+r.sp.map(w=>w.join(',')).join('\n')+'\n';
  });
  return o;
}
function showPerf(){
  const a=perfLoad(),txt=perfReport(5).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  page('<h2 style="margin:0">📊 บันทึกประสิทธิภาพ</h2>'+
    '<div style="font-size:13px;color:#bcd;max-width:340px">เก็บอัตโนมัติทุกรอบ ('+a.length+'/5 รอบ) กดคัดลอกแล้ววางส่งในแชทได้เลย</div>'+
    '<textarea id="pft" readonly style="height:180px">'+txt+'</textarea>'+
    '<button class="big" data-a="pfcopy">📋 คัดลอก</button>'+
    '<button class="big sec" data-a="pfclear">🗑️ ล้างบันทึก</button>'+
    '<button class="big sec" data-a="set">← กลับ</button>');
}
addEventListener('pagehide',()=>{try{perfSave()}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)perfSave()});

function loop(now){
  const raw=Math.max(0,(now-last)/1000),dt=Math.min(.05,raw);last=now;  // v24: กันเวลาติดลบ (rAF timestamp ย้อน) ที่ทำให้ท่าเดิน/ellipse พัง
  if(state==='play')peakFrameMs=Math.max(peakFrameMs,raw*1000);
  if(state==='play'){
    const t0=performance.now();
    if(G.hstop>0){G.hstop-=raw;fu=0}else{update(dt);}
    const du=performance.now()-t0;upAcc+=du;if(G.hstop<=0)fu=du;
    // เฝ้าดู FPS: ถ้าตั้งเป็นอัตโนมัติและเฟรมเรตต่ำติดกัน 3 วินาที จะลดคุณภาพให้เอง
    fpsAcc+=raw;fpsN++;
    if(fpsAcc>=1){
      fps=Math.round(fpsN/fpsAcc);avgMs=fpsAcc*1000/fpsN;upMs=upAcc/fpsN;drMs=drAcc/fpsN;
      fpsAcc=0;fpsN=0;upAcc=0;drAcc=0;lastPeakFrameMs=peakFrameMs;peakFrameMs=0;
      // governor: เฟรมช้า/สะดุดต่อเนื่อง -> ลดเพดานซอมบี้ทีละ 10 ; เฟรมดีนานๆ -> ค่อยๆ คืนทีละ 5
      if(avgMs>20||lastPeakFrameMs>45){badCnt++;goodCnt=0}
      else if(avgMs<18&&lastPeakFrameMs<30){goodCnt++;badCnt=0}
      else{badCnt=0;goodCnt=0}
      if(badCnt>=2&&MAX_Z>Z_MIN){MAX_Z=Math.max(Z_MIN,MAX_Z-10);badCnt=0}
      else if(goodCnt>=12&&MAX_Z<Z_BASE){MAX_Z=Math.min(Z_BASE,MAX_Z+5);goodCnt=0}
      perfTick();
      if(S.q==='auto'&&!lowQ){lowCnt=(fps<45||lastPeakFrameMs>34)?lowCnt+1:0;if(lowCnt>=2){lowQ=true;applyDPR();G.ban={s:'⚙️ ลดคุณภาพกราฟิกอัตโนมัติ',t:2}}}
    }
  }
  if(state!=='menu'){const t1=performance.now();draw();fd=performance.now()-t1;if(state==='play'){drAcc+=fd;perfSpike(raw*1000)}}
  requestAnimationFrame(loop);
}
applyCustom();loadMapImgs();
if(!CHARS[S.sel])S.sel='soldier';
if(!MAPS[S.map]||!S.maps.includes(S.map))S.map='forest';
reset();
showMenu();
bootStart();
requestAnimationFrame(loop);
</script>
