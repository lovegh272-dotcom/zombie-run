<body>
<canvas id="c"></canvas>
<div id="top"><button id="pb"></button><button id="mb"></button><button id="fb"></button></div>

<script>
// v53: เก็บรูปทุกรูปที่สร้าง เพื่อถอดรหัสล่วงหน้า (กันเฟรมสะดุดตอนรูปถูกวาดครั้งแรก)
const ALLIMG=[];{const _I=window.Image;window.Image=function(w,h){const i=new _I(w,h);ALLIMG.push(i);return i};window.Image.prototype=_I.prototype}
const WARMC=document.createElement('canvas');WARMC.width=WARMC.height=2;const WARMX=WARMC.getContext('2d');let warmI=0;
function warmImgs(all){let n=0;for(;warmI<ALLIMG.length;warmI++){const im=ALLIMG[warmI];if(!im.complete){if(all)continue;break}if(im.naturalWidth){try{WARMX.drawImage(im,0,0,2,2)}catch(e){}}if(!all&&++n>=8){warmI++;break}}}
setInterval(()=>{if(typeof state==='undefined'||state!=='play')warmImgs(false)},60);
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const DPR0=Math.min(devicePixelRatio||1,2);let W_,H_,DPR=DPR0;
function resize(){W_=innerWidth;H_=innerHeight;cv.width=W_*DPR;cv.height=H_*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
function applyDPR(){const n=lowQ?Math.min(DPR0,1.25):DPR0;if(n!==DPR){DPR=n;resize()}}
addEventListener('resize',()=>{resize();if(innerHeight>innerWidth&&state==='play')togglePause()});resize();
function lockLand(){try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}

const BOSS_EVERY=120;

// ---------- PWA ----------
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// ---------- Save data ----------
function defSave(){return{coins:0,up:{},chars:['soldier'],sel:'soldier',ach:{},maps:['forest','deadport','darkgrave'],map:'forest',diff:'normal',mode:'endless',
  q:'auto',fps:false,dh:[],lb:[],st:{kills:0,boss:0,games:0,best:0,coins:0,wins:0},custom:{maps:{},chars:{}}}}

function loadSave(){
  const d=defSave();
  try{const s=JSON.parse(localStorage.zsave||'{}');
    Object.assign(d,s);d.st=Object.assign(defSave().st,s.st||{});d.up=s.up||{};d.ach=s.ach||{};
    if(!d.chars||!d.chars.length)d.chars=['soldier'];
    if(!d.maps||!d.maps.length)d.maps=['forest'];
    d.lb=Array.isArray(s.lb)?s.lb:[];
d.custom={maps:(s.custom&&s.custom.maps)||{},chars:(s.custom&&s.custom.chars)||{}};
    d.dh=Array.from({length:30},(_,i)=>+(s.dh&&s.dh[i])||0);
  }catch(e){}
  if(d.dh.length!==30)d.dh=Array(30).fill(0);
  d.st.best=Math.max(d.st.best||0,+localStorage.zbest||0);
  return d;
}
let S=loadSave();
function save(){try{localStorage.zsave=JSON.stringify(S)}catch(e){}
}
const lvOf=id=>S.up[id]||0;

// ---------- Maps / Difficulty / Modes ----------
const MAPS={
  crypt:{n:'ดันเจี้ยนอเวจี',ic:'🕳️',hidden:1,d:'ด่านลับ (เข้าได้จากประตูหลังฆ่าบอส)',price:99999,seed:6660,bg:'#1c0f15',grid:'#2c1821',ob:'#0d0709',em:['🦴','⚰️','🕯️','🗿','💀','⛓️'],dens:2,rmin:20,rmax:34,bias:['mini','necromancer','tank'],bp:.22},
  forest:{n:'ป่ามรณะ',ic:'🌲',d:'ต้นไม้เยอะ ใช้หลบและกั้นฝูงได้ ซอมบี้ปกติ',price:0,seed:1,bg:'#1b2418',grid:'#26331f',ob:'#12200f',em:['🌲','🌳','🪨','🪵','🌿'],dens:3,rmin:22,rmax:36,bias:null,bp:0},
  city:{n:'เมืองร้าง',ic:'🏙️',d:'รถและกำแพงกั้นทาง ซอมบี้วิ่งเร็วออกเยอะ',price:250,seed:2,bg:'#23262b',grid:'#30343b',ob:'#141619',em:['🚗','🚌','🧱','🛍️','🗑️','🏚️'],dens:2,rmin:26,rmax:42,bias:['fast'],bp:.18},
  hosp:{n:'โรงพยาบาลร้าง',ic:'🏥',d:'ซอมบี้พิเศษ ระเบิด/คายกรด/แบ่งร่าง ออกเยอะ',price:500,seed:3,bg:'#1f2a2c',grid:'#2b3b3e',ob:'#0f191b',em:['🛏️','🗄️','⚰️','🧰','♿'],dens:2,rmin:22,rmax:34,bias:['boom','spit','split'],bp:.2,fx:'toxic'},
  deadport:{n:'ท่าเรือร้าง',ic:'⚓',d:'ตู้คอนเทนเนอร์กั้นทาง ซอมบี้เกราะหนาและตัวระเบิดออกบ่อย',price:0,seed:2847,bg:'#172633',grid:'#293b49',ob:'#0b151e',em:['📦','🛢️','⚓','🚢','🧵'],dens:3,rmin:24,rmax:42,bias:['tank','boom','normal'],bp:0.25,fx:'port'},
  darkgrave:{n:'สุสานยามค่ำคืน',ic:'🪦',d:'สุสานหมอกหนาท่ามกลางความมืด ซอมบี้วิ่งเร็วและพ่นพิษโจมตี',price:0,seed:7391,bg:'#211a32',grid:'#352a49',ob:'#120e1d',em:['🪦','⚰️','🌳','🕯️','🗿','🌲'],dens:1,rmin:16,rmax:30,bias:['fast','boom','spit'],bp:0.3,fx:'dark'}
};
const DIFF={
  easy:{n:'ง่าย',ic:'🙂',hp:.75,sp:.8,dm:.8,coin:.7,d:'ซอมบี้อ่อนและน้อยลง เหรียญ x0.7'},
  normal:{n:'ปกติ',ic:'😐',hp:1,sp:1,dm:1,coin:1,d:'สมดุลตามค่าเดิม เหรียญ x1'},
  hell:{n:'นรก',ic:'😈',hp:1.5,sp:1.3,dm:1.3,coin:1.6,d:'ซอมบี้อึด เยอะ และตีแรง เหรียญ x1.6'},

const MODES={

  m15:{n:'รอด 15 นาที',ic:'⏱️',goal:900,bonus:300,d:'รอดครบเวลา = ชนะ โบนัส +300 🪙'},

  extract:{n:'อพยพ',ic:'📡',goal:480,bonus:500,d:'รับสัญญาณอะไหล่ 3 ชิ้น กลับฐาน และป้องกันจุดอพยพ 45 วินาที (เป้าหมาย 6–8 นาที)'},
  daily:{n:'ท้าทายรายวัน',ic:'📅',goal:600,bonus:400,d:'แผนที่และกฎพิเศษเปลี่ยนทุกวัน ทุกเครื่องได้ชุดเดียวกัน รอด 10 นาที = ชนะ (ความยากปกติ)'}
};
// ---------- v38: ท้าทายรายวัน ----------
// สุ่มจากวันที่ (เวลาไทย) ทุกเครื่องได้แผนที่ + กฎชุดเดียวกันในวันเดียวกัน
const DRULES_BAD=[
  {id:'zfast',n:'🏃 ซอมบี้เร็วขึ้น 20%',f:()=>{G.zsm*=1.2}},

function updStory(dt){

  if(st.k==='collect'){
    for(let i=G.sItems.length-1;i>=0;i--){const c=G.sItems[i];
      if(Math.hypot(P.x-c.x,P.y-c.y)<P.r+30){c.p+=dt;if(Math.random()<dt*2)sfx('ui_tab');if(c.p>=st.ch2){G.sItems.splice(i,1);G.sGot++;sfx('pickup');burst(c.x,c.y,'#6f6',14);
        G.ban={s:st.it+' '+st.itn+' '+G.sGot+'/'+st.n2,t:1.8};
        if(G.sItems.length===1&&!G.sFear){G.sFear=1;G.ban={s:'🩸 กลิ่นเลือดลอยไปทั่ว... ฝูงซอมบี้คลั่งกำลังมา!',t:3.5};G.shake=14;sfx('roar');storyHorde(14);spawnElite();G.ev='blood';G.evt=40}
        if(!G.sItems.length){G.sHeal={x:G.sHome.x,y:G.sHome.y,c:0};G.ban={s:'✅ ครบแล้ว! กลับไปยืนในวงรักษา '+st.heal+' วิ',t:3.5};sfx('misok')}}}

const CS=360;let OB=new Map();
function rnd(cx,cy,k){let h=(cx*374761393+cy*668265263+(k+M.seed*131)*1274126177)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function chunk(cx,cy){
  const key=cx*100003+cy;let a=OB.get(key);
  if(a)return a;
  a=[];const n=Math.floor(rnd(cx,cy,1)*(M.dens+1));
  for(let k=0;k<n;k++){
    const x=cx*CS+rnd(cx,cy,10+k*4)*CS,y=cy*CS+rnd(cx,cy,11+k*4)*CS;
    if(Math.hypot(x,y)<220)continue;
    a.push({x,y,r:M.rmin+rnd(cx,cy,12+k*4)*(M.rmax-M.rmin),e:Math.floor(rnd(cx,cy,13+k*4)*M.em.length)});
  }
  if(OB.size>600)OB.clear();
  OB.set(key,a);return a;
}
function pushOut(e,r){
  const cx=Math.floor(e.x/CS),cy=Math.floor(e.y/CS);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
    const a=chunk(cx+i,cy+j);
    for(let q=0;q<a.length;q++){
      const o=a[q],dx=e.x-o.x,dy=e.y-o.y,mn=o.r+r,d2=dx*dx+dy*dy;
      if(d2<mn*mn){const d=Math.sqrt(d2)||.01;e.x=o.x+dx/d*mn;e.y=o.y+dy/d*mn}
    }
  }
}

// ---------- Custom content (ด่าน/ตัวละครที่ AI สร้าง) ----------
const ALLOW=['normal','fast','tank','boom','spit','split','mini','screamer','shield','healer','necromancer'];
const clamp=(v,a,b,d)=>{v=+v;return isFinite(v)?Math.min(b,Math.max(a,v)):d};
const clean=(s,n)=>String(s==null?'':s).replace(/[<>&"'`\\]/g,'').trim().slice(0,n);
const hex=(s,d)=>/^#[0-9a-f]{6}$/i.test(s)?s:d;
const emo=(s,d)=>clean(Array.from(String(s||'')).slice(0,4).join(''),8)||d;

function sanMap(o){
  if(!o||typeof o!=='object')return null;
  const rmin=clamp(o.rmin,14,30,22);
  const em=(Array.isArray(o.em)?o.em:[]).slice(0,4).map(e=>emo(e,'🪨'));
  const bias=(Array.isArray(o.bias)?o.bias:[]).filter(t=>ALLOW.includes(t)).slice(0,4);
  return{n:clean(o.n,24)||'ด่านใหม่',ic:emo(o.ic,'🗺️'),d:clean(o.d,80),price:0,
    seed:Math.floor(clamp(o.seed,1,9999,7)),
    bg:hex(o.bg,'#222222'),grid:hex(o.grid,'#2e2e2e'),ob:hex(o.ob,'#111111'),
    em:em.length?em:['🪨'],dens:Math.round(clamp(o.dens,0,4,2)),
    rmin,rmax:clamp(o.rmax,rmin,50,rmin+10),
    bias:bias.length?bias:null,bp:bias.length?clamp(o.bp,0,.4,.15):0};
}
function sanChar(o){
  if(!o||typeof o!=='object')return{err:'ข้อมูลไม่ถูกต้อง'};
  const w=['blade','nade','ltn','sg'].includes(o.start)?o.start:null;
  const c={n:clean(o.n,20)||'ตัวละครใหม่',ic:emo(o.ic,'🧑'),d:clean(o.d,80),price:0,
    hp:clamp(o.hp,.6,1.5,1),dmg:clamp(o.dmg,.6,1.6,1),rate:clamp(o.rate,.6,1.5,1),
    spd:clamp(o.spd,.85,1.15,1),range:clamp(o.range,.8,1.6,1),
    pierce:Math.round(clamp(o.pierce,0,2,0)),blade:0,nade:0,ltn:0,sg:0,
    col:hex(o.col,'#3a8cff'),start:w};
  if(w)c[w]=1;
  const sc=(c.hp-1)+(c.dmg-1)+(c.rate-1)+2*(c.spd-1)+.5*(c.range-1)+(w?.15:0)+.1*c.pierce;
  if(sc>.4)return{err:c.n+' เก่งเกินไป (คะแนนพลัง '+sc.toFixed(2)+' เกิน 0.4)'};
  return{ok:c};
}
function applyCustom(){
  for(const id in S.custom.maps){const m=sanMap(S.custom.maps[id]);if(m)MAPS[id]=m}
  for(const id in S.custom.chars){const r=sanChar(S.custom.chars[id]);if(r.ok){CHARS[id]=r.ok;PCOL[id]=r.ok.col}}
}
function importCustom(txt){
  const s=txt.replace(/```[a-z]*/gi,''),a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a<0||b<a)return'ไม่พบข้อมูล JSON';
  let o;try{o=JSON.parse(s.slice(a,b+1))}catch(e){return'JSON ผิดรูปแบบ: '+e.message}
  const msg=[];let nm=0,nc=0;
  const mk=(raw,i,pre)=>'c_'+(clean(raw&&raw.id,12).replace(/[^a-z0-9_]/gi,'')||(pre+(Date.now()%100000)+i));
  (Array.isArray(o.maps)?o.maps:[]).slice(0,5).forEach((raw,i)=>{
    const v=sanMap(raw);
    if(!v){msg.push('ด่านที่ '+(i+1)+' ใช้ไม่ได้');return}
    if(Object.keys(S.custom.maps).length>=12){msg.push('ด่านเต็ม (สูงสุด 12)');return}
    const id=mk(raw,i,'m');S.custom.maps[id]=v;if(!S.maps.includes(id))S.maps.push(id);nm++;
  });
  (Array.isArray(o.chars)?o.chars:[]).slice(0,5).forEach((raw,i)=>{
    const r=sanChar(raw);
    if(r.err){msg.push(r.err);return}
    if(Object.keys(S.custom.chars).length>=12){msg.push('ตัวละครเต็ม (สูงสุด 12)');return}
    const id=mk(raw,i,'h');S.custom.chars[id]=r.ok;if(!S.chars.includes(id))S.chars.push(id);nc++;
  });
  applyCustom();loadMapImgs();save();
  return'นำเข้าสำเร็จ: ด่าน '+nm+' | ตัวละคร '+nc+(msg.length?' | ปัญหา: '+msg.join(', '):'');
}
function delCustom(){
  for(const id in S.custom.maps){delete MAPS[id];S.maps=S.maps.filter(x=>x!==id);if(S.map===id)S.map='forest'}
  for(const id in S.custom.chars){delete CHARS[id];S.chars=S.chars.filter(x=>x!==id);if(S.sel===id)S.sel='soldier'}
  S.custom={maps:{},chars:{}};save();
}

// ---------- Audio: synthesized SFX + original ambient BGM (v14) ----------
let AC=null,muted=localStorage.zmute==='1',bgmOn=localStorage.zbgm!=='0',sfxOn=localStorage.zsfx!=='0';
const VOLS=[.35,.7,1];
let bgmVol=+localStorage.zbv>0?+localStorage.zbv:.7,sfxVol=+localStorage.zsv>0?+localStorage.zsv:1;
let curDest=null,PM=1; // v43: ปลายทางชั่วคราว (แพน/ระยะ) + สุ่มระดับเสียงเล็กน้อย
let sfxBus=null,musicBus=null,musicTimer=null,musicIndex=0,barAt=0,noiseBuf=null,voices=0,CRIT=false,ducked=false;
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  // iOS Safari อาจเป็น 'interrupted' (สายเข้า/สลับแอป) นอกเหนือจาก 'suspended'
  if(AC&&(AC.state==='suspended'||AC.state==='interrupted')){try{const p=AC.resume();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
  if(AC&&!sfxBus){sfxBus=AC.createGain();sfxBus.gain.value=.72*sfxVol;sfxBus.connect(AC.destination);
    AC.onstatechange=()=>{if(AC.state==='running'&&musicTimer)musicBar()};setTimeout(loadSounds,0)}
  return AC;
}
function tone(f,d,type,vol,slide){
  if(muted||!sfxOn)return;const a=ac();if(!a||a.state!=='running'||voices>=(CRIT?28:14))return;
  const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  f*=PM;o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide*PM),t+d);
  g.gain.setValueAtTime(Math.max(.0001,vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  voices++;o.onended=()=>{voices--;try{g.disconnect()}catch(e){}};
  o.connect(g);g.connect(curDest||sfxBus||a.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d,vol,cut=1400){
  if(muted||!sfxOn)return;const a=ac();if(!a||a.state!=='running'||voices>=(CRIT?28:14))return;
  if(!noiseBuf){ // บัฟเฟอร์สัญญาณรบกวนสร้างครั้งเดียวแล้วใช้ซ้ำ (เดิมสร้างใหม่ทุกครั้งที่ยิง/โดน)
    const n=Math.floor(a.sampleRate*1.5);noiseBuf=a.createBuffer(1,n,a.sampleRate);
    const data=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)data[i]=Math.random()*2-1;
  }
  const t=a.currentTime,src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  src.buffer=noiseBuf;f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  voices++;src.onended=()=>{voices--;try{g.disconnect();f.disconnect()}catch(e){}};
  src.connect(f);f.connect(g);g.connect(curDest||sfxBus||a.destination);src.start(t,Math.random()*(noiseBuf.duration-d-.1),d+.02);
}
function musicNote(freq,when,dur,vol,type='sine'){
  if(!AC||!musicBus)return;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,when);
  const attack=Math.min(.45,dur*.25),release=Math.max(attack+.01,dur-.35);g.gain.setValueAtTime(.0001,when);g.gain.linearRampToValueAtTime(vol,when+attack);g.gain.setValueAtTime(vol,when+release);g.gain.linearRampToValueAtTime(.0001,when+dur);
  o.onended=()=>{try{g.disconnect()}catch(e){}};
  o.connect(g);g.connect(musicBus);o.start(when);o.stop(when+dur+.03);
}
// 0 = เมนู, 1 = กำลังเล่น, 2 = มีบอส (try/catch กัน TDZ ตอนสคริปต์เพิ่งโหลด)
function musicLevel(){try{return state==='play'?(G&&G.boss?2:1):0}catch(e){return 0}}
// v37: เหตุการณ์ที่ตึงเครียด (พระจันทร์เลือด/ฝูงบุก/ไล่หัวหน้า) และเฮลิคอปเตอร์มา
function musicTense(){try{return state==='play'&&G&&(G.ev==='blood'||G.ev==='elite'||G.hordeT>0||G.inDun)}catch(e){return false}}
function musicHeli(){try{return state==='play'&&G&&G.heli&&G.heli.leave<=0}catch(e){return false}}
// v37: เพลงหลายธีม สลับทุก 8 บาร์ (เดิมวน 4 คอร์ดเดียวตลอดเกม) — สร้างเสียงเอง ไม่ใช้ไฟล์
const MCH=(r,mi)=>[r,r*(mi?1.1892:1.2599),r*1.4983];
const THEMES=[
  {ch:[MCH(110,1),MCH(98,0),MCH(130.81,0),MCH(87.31,0)],pl:[0,.72,1.44,2.16],pn:[2,1,2.5,1]},          // Am G C F (ธีมเดิม)
  {ch:[MCH(146.83,1),MCH(116.54,0),MCH(87.31,0),MCH(130.81,0)],pl:[0,.4,1.2,1.6,2.4],pn:[2,2.5,1,2,1.5]}, // Dm Bb F C
  {ch:[MCH(82.41,1),MCH(130.81,0),MCH(98,0),MCH(146.83,0)],pl:[0,.8,1.2,2,2.8],pn:[1,2,2.5,2,1]},         // Em C G D
  {ch:[MCH(110,1),MCH(87.31,0),MCH(146.83,1),MCH(82.41,0)],pl:[0,.6,1.6,2.2],pn:[2,1.5,2,2.5]}             // Am F Dm E (ตึงขึ้น)
];
let mTheme=0,mBar=0;
function musicNoise(when,dur,vol,cut,hp){
  if(!AC||!musicBus)return;
  if(!noiseBuf){const n=Math.floor(AC.sampleRate*1.5);noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}
  const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=noiseBuf;f.type=hp?'highpass':'lowpass';f.frequency.value=cut;
  g.gain.setValueAtTime(vol,when);g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  src.onended=()=>{try{g.disconnect();f.disconnect()}catch(e){}};
  src.connect(f);f.connect(g);g.connect(musicBus);src.start(when,Math.random()*(noiseBuf.duration-dur-.1),dur+.02);
}
function musicKick(when,vol){
  if(!AC||!musicBus)return;const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(110,when);o.frequency.exponentialRampToValueAtTime(42,when+.16);
  g.gain.setValueAtTime(vol,when);g.gain.exponentialRampToValueAtTime(.0001,when+.22);
  o.onended=()=>{try{g.disconnect()}catch(e){}};o.connect(g);g.connect(musicBus);o.start(when);o.stop(when+.25);
}
// v43: เพลงจากไฟล์ (ไม่บังคับ) bgm_menu / bgm_play / bgm_boss / bgm_dungeon ใน sounds.json -> เล่นวนแทนเพลงสังเคราะห์ ครอสเฟด 1.5 วิ
let bgmCur=null;
function bgmKind(){try{if(state!=='play')return'bgm_menu';if(G.inDun)return SND.buf.bgm_dungeon?'bgm_dungeon':'bgm_boss';return G.boss?'bgm_boss':'bgm_play'}catch(e){return'bgm_menu'}}
function bgmSample(){
  const k=bgmKind(),bl=SND.buf[k]||(k!=='bgm_play'&&SND.buf.bgm_play);
  if(!bl||!bl.length){if(bgmCur){const c=bgmCur;bgmCur=null;try{c.g.gain.setTargetAtTime(0,AC.currentTime,.4);setTimeout(()=>{try{c.src.stop()}catch(e){}},2000)}catch(e){}}return false}
  if(bgmCur&&bgmCur.k===k)return true;
  if(bgmCur){const c=bgmCur;try{c.g.gain.setTargetAtTime(0,AC.currentTime,.5);setTimeout(()=>{try{c.src.stop()}catch(e){}},2500)}catch(e){}}
  const src=AC.createBufferSource(),g=AC.createGain();src.buffer=bl[0];src.loop=true;g.gain.value=0;g.gain.setTargetAtTime(.9,AC.currentTime,.5);
  src.connect(g);g.connect(musicBus);src.start();bgmCur={k,src,g};return true;
}
function musicBar(){
  if(!AC||!musicBus||muted||!bgmOn||AC.state!=='running')return;
  if(bgmSample()){barAt=AC.currentTime+3.2;return}
  if(AC.currentTime<barAt-.5)return; // กันซ้อนบาร์เมื่อ interval กับ statechange ชนกัน
  const now=AC.currentTime+.08;barAt=AC.currentTime+3.2;
  if(mBar>0&&mBar%8===0){let n=Math.floor(Math.random()*THEMES.length);if(n===mTheme)n=(n+1)%THEMES.length;mTheme=n}
  mBar++;
  const lv=musicLevel(),tense=musicTense(),heli=musicHeli();
  const th=lv===2||tense?THEMES[3]:THEMES[mTheme];
  const chord=th.ch[musicIndex%th.ch.length];musicIndex++;
  chord.forEach((f,i)=>musicNote(f,now,3.15,.018+(i===0?.009:0),i===0?'triangle':'sine'));
  musicNote(chord[0]/2,now,2.9,.035,'triangle');
  th.pl.forEach((t,i)=>{const m=th.pn[i%th.pn.length],f=m===1?chord[1]*2:m===1.5?chord[2]*1.5:m===2?chord[2]*2:chord[0]*2.5;musicNote(f,now+t,.34,.012,'triangle')});
  if(lv>=1){
    for(let k=0;k<4;k++)musicNote(chord[0]/2,now+k*.8,.24,.028,'triangle'); // ชีพจรเบสตอนเล่น
    musicKick(now,.06);musicKick(now+1.6,.05);
    for(let k=0;k<8;k++)musicNoise(now+k*.4+.2,.05,k%2?.008:.012,6000,1); // ไฮแฮตเบาๆ
  }
  if(lv>=2||tense){
    for(let k=0;k<8;k++)musicNote(chord[k%3]*2,now+k*.4,.18,.011,'square'); // อาร์เปจจิโอตอนบอส/เหตุการณ์
    musicKick(now+.8,.05);musicKick(now+2.4,.05);
    for(let k=0;k<4;k++)musicNoise(now+k*.8+.4,.12,.018,1800,0); // สแนร์
  }
  if(tense)for(let k=0;k<16;k++)musicNote(chord[0],now+k*.2,.1,.01,'sawtooth'); // ostinato เร่งจังหวะ
  if(heli)[1,1.25,1.5,2].forEach((m,i)=>musicNote(chord[0]*2*m,now+i*.5,.6,.012,'sine')); // ทำนองสว่างเมื่อเฮลิมา
}
function startBGM(){
  if(muted||!bgmOn)return;const a=ac();if(!a||musicTimer)return;
  musicBus=a.createGain();musicBus.gain.value=.62*bgmVol*(ducked?.35:1);musicBus.connect(a.destination);barAt=0;musicBar();musicTimer=setInterval(musicBar,3200);
}
function stopBGM(){

// ---------- Sprites (วาดล่วงหน้าลง offscreen canvas แล้วใช้ซ้ำ) ----------
const SPR=new Map();
function shade(h,a){
  if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];
  const n=parseInt(h.slice(1),16),cl=v=>Math.max(0,Math.min(255,v));
  return 'rgb('+cl((n>>16)+a)+','+cl(((n>>8)&255)+a)+','+cl((n&255)+a)+')';
}
function spr(T,col,fr){
  const key=T.r+'|'+col+'|'+fr+'|'+(T.kind||T.xp);
  let s=SPR.get(key);if(s)return s;
  const r=T.r,sz=Math.ceil(r*3.4),c=document.createElement('canvas');
  c.width=c.height=sz*2;
  const x=c.getContext('2d');x.scale(2,2);x.translate(sz/2,sz/2);x.lineCap='round';
  const sw=fr?1:-1;
  // แขน (หันไปทางขวา = ทิศที่ซอมบี้เดินไปหาผู้เล่น)
  for(const sd of[-1,1]){
    const reach=r*(1.1+(sd===sw?.3:0));
    x.strokeStyle=shade(col,-15);x.lineWidth=r*.34;
    x.beginPath();x.moveTo(r*.1,sd*r*.72);x.lineTo(reach,sd*r*.5);x.stroke();
    x.fillStyle=shade(col,-35);x.beginPath();x.arc(reach,sd*r*.5,r*.19,0,6.28);x.fill();
  }
  // ลำตัว
  x.fillStyle=shade(col,-35);x.strokeStyle='rgba(0,0,0,.4)';x.lineWidth=1;
  x.beginPath();x.ellipse(-r*.1,0,r*.62,r*.98,0,0,6.28);x.fill();x.stroke();
  if(T.xp===6&&!T.kind){x.fillStyle=shade(col,-60);for(const sd of[-1,1]){x.beginPath();x.arc(0,sd*r*.85,r*.3,0,6.28);x.fill()}}
  if(T.kind==='boom'){x.fillStyle='#c22';x.fillRect(-r*.8,-r*.35,r*.42,r*.7);x.strokeStyle='#fb0';x.lineWidth=2;x.beginPath();x.arc(0,0,r*1.08,0,6.28);x.stroke()}
  // หัว
  x.fillStyle=col;x.strokeStyle='rgba(0,0,0,.4)';x.lineWidth=1;
  x.beginPath();x.arc(r*.2,0,r*.62,0,6.28);x.fill();x.stroke();
  if(T.kind==='boss'){x.fillStyle='#eee';for(const sd of[-1,1]){x.beginPath();x.moveTo(r*.25,sd*r*.4);x.lineTo(r*.95,sd*r*.75);x.lineTo(r*.6,sd*r*.15);x.fill()}}
  if(T.kind==='spit'){x.fillStyle='#bfa';x.beginPath();x.arc(r*.72,0,r*.2,0,6.28);x.fill()}
  // ตา
  x.fillStyle='#e22';
  for(const sd of[-1,1]){x.beginPath();x.arc(r*.58,sd*r*.26,r*.15,0,6.28);x.fill()}
  s={c,sz};SPR.set(key,s);return s;
}

function makeExtraction(){
  const parts=[],firstAngle=-Math.PI/2+(M.seed%8)*Math.PI/16;
  for(let i=0;i<3;i++){
    const angle=firstAngle+i*Math.PI*2/3;
    let x,y;
    for(let r=680;r<=1100;r+=70){
      x=Math.cos(angle)*r;y=Math.sin(angle)*r;
      const cx=Math.floor(x/CS),cy=Math.floor(y/CS);
      let clear=true;
      for(let dx=-1;dx<=1&&clear;dx++)for(let dy=-1;dy<=1&&clear;dy++){
        for(const o of chunk(cx+dx,cy+dy)){
          if(Math.hypot(x-o.x,y-o.y)<o.r+45){clear=false;break}
        }
      }
      if(clear)break;
    }
    parts.push({x,y,readyAt:60+i*120,progress:0});
  }
  return{parts,count:0,phase:'parts',base:{x:0,y:0},radius:120,defend:45};
}
function updateExtraction(dt){
  const ex=G.ex;if(!ex)return false;
  const baseDistance=Math.hypot(P.x-ex.base.x,P.y-ex.base.y);
  if(ex.phase==='parts'&&ex.count<ex.parts.length){
    const part=ex.parts[ex.count];
    if(G.t>=part.readyAt){
      if(Math.hypot(P.x-part.x,P.y-part.y)<48){
        part.progress+=dt;
        if(part.progress>=1.25){
          ex.count++;sfx('pickup');burst(part.x,part.y,'#6cf',18);
          G.ban={s:'📡 ได้อะไหล่วิทยุ '+ex.count+'/3',t:2.5};
          if(ex.count===ex.parts.length){
            ex.phase='return';
            G.ban={s:'🚁 เก็บครบแล้ว! กลับจุดอพยพ',t:3};
          }
        }
      }else part.progress=0;
    }
  }else if(ex.phase==='return'&&baseDistance<ex.radius){
    ex.phase='defend';G.ban={s:'🛡️ ป้องกันจุดอพยพ 45 วินาที!',t:3};sfx('boss');
  }
  if(ex.phase==='defend'&&baseDistance<ex.radius){
    ex.defend=Math.max(0,ex.defend-dt);
    if(ex.defend<=0){gameOver(true);return true}
  }
  return false;
}

function edgeArrow(tx,ty,icon,col){
  const dx=tx-P.x,dy=ty-P.y,dist=Math.hypot(dx,dy),a=Math.atan2(dy,dx),mg=34;
  const sc=Math.min((W_/2-mg)/Math.max(1,Math.abs(dx)),(H_/2-mg)/Math.max(1,Math.abs(dy)));
  if(sc>=1)return;
  const x=W_/2+dx*sc,y=H_/2+dy*sc;
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  ctx.fillStyle='#071018';ctx.beginPath();ctx.arc(0,0,23,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-11);ctx.lineTo(-10,11);ctx.closePath();ctx.fill();
  ctx.rotate(-a);ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText(icon,0,6);
  ctx.font='bold 11px sans-serif';ctx.fillStyle='#fff';ctx.fillText(Math.round(dist)+'m',0,36);
  ctx.restore();
}

  {

  let target,icon;
  if(ex.phase==='parts'&&G.t>=ex.parts[ex.count].readyAt){
    target=ex.parts[ex.count];icon='📡';
  }else if(ex.phase==='return'||ex.phase==='defend'){
    target=ex.base;icon='🚁';
  }else return;
  const dx=target.x-P.x,dy=target.y-P.y,dist=Math.hypot(dx,dy);
  const a=Math.atan2(dy,dx),margin=34;
  const scale=Math.min((W_/2-margin)/Math.max(1,Math.abs(dx)),(H_/2-margin)/Math.max(1,Math.abs(dy)));
  if(scale>=1)return;
  const x=W_/2+dx*scale,y=H_/2+dy*scale;
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  ctx.fillStyle='#071018';ctx.beginPath();ctx.arc(0,0,23,0,6.28);ctx.fill();
  ctx.fillStyle='#6cf';ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-11);ctx.lineTo(-10,11);ctx.closePath();ctx.fill();
  ctx.rotate(-a);ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText(icon,0,6);
  ctx.font='bold 11px sans-serif';ctx.fillStyle='#fff';ctx.fillText(Math.round(dist)+'m',0,36);
  ctx.restore();
}
// ---------- Perf logger (v15): เก็บค่าประสิทธิภาพอัตโนมัติทุกรอบ ลง localStorage ----------
const PERF_KEY='zperf';
let PR=null,fu=0,fd=0,pfu=0,pfd=0;
const pa={n:0,fps:999,avg:0,max:0,up:0,dr:0};
function r1(x){return Math.round(x*10)/10}
function perfLoad(){try{return JSON.parse(localStorage[PERF_KEY]||'[]')}catch(e){return[]}}
function perfSave(){
  if(!PR)return;
  try{const a=perfLoad().filter(r=>r.id!==PR.id);a.push(PR);while(a.length>5)a.shift();localStorage[PERF_KEY]=JSON.stringify(a)}catch(e){}
}
function perfStart(){
  try{PR={id:Date.now(),ch:S.sel,map:(M&&M.n)||'',df:(D&&D.n)||'',mo:(MO&&MO.n)||'',mob:MOB?1:0,dpr:DPR0,vp:innerWidth+'x'+innerHeight,zb:Z_BASE,
    ua:navigator.userAgent.slice(0,100),rows:[],sp:[],end:0}}catch(e){PR=null}
  pa.n=0;pa.fps=999;pa.avg=pa.max=pa.up=pa.dr=0;pfu=pfd=0;
}
// เรียกทุก 1 วินาทีของเกม: รวม 5 วินาทีเป็น 1 แถว
function perfTick(){
  pa.n++;pa.fps=Math.min(pa.fps,fps);pa.avg+=avgMs;pa.max=Math.max(pa.max,lastPeakFrameMs);pa.up+=upMs;pa.dr+=drMs;
  if(pa.n>=5){
    if(PR&&PR.rows.length<240){
      PR.rows.push([Math.floor(G.t),pa.fps,r1(pa.avg/5),Math.round(pa.max),r1(pa.up/5),r1(pa.dr/5),Z.length,MAX_Z,FX.length+G.fxl.length,PART.length,TXT.length,DECALS.length,lowQ?1:0,EB.length,B.length,perfFlags()]);
      if(PR.rows.length%4===0)perfSave();
    }
    pa.n=0;pa.fps=999;pa.avg=pa.max=pa.up=pa.dr=0;
  }
}
// เฟรมสะดุด (>45ms): จดว่าเฟรมก่อนหน้าใช้ update/draw กี่ ms และบนจอมีอะไร (B=บอส U=ULT + ชื่ออีเวนต์)
// ถ้า ms สูงแต่ upd+drw ต่ำ แปลว่าคอขวดอยู่นอก JS (GPU/ระบบ)
// v47: ป้ายสถานะ D=ในดันเจี้ยน B=มีบอส C=มีคู่หู Fn=สูตรผสม En=วิวัฒนาการ U=ULT
function perfFlags(){try{const f=Object.keys(G.fus||{}).filter(k=>G.fus[k]).length;return[G.inDun?'D':'',G.boss?'B':'',G.comp?'C':'',f?'F'+f:'',G.evoN?'E'+G.evoN:'',(G.ult&&G.ult.t>0)?'U':''].filter(Boolean).join('')||'-'}catch(e){return'-'}}
function perfSpike(jf){
  if(PR&&jf>34&&jf<500&&PR.sp.length<40)
    PR.sp.push([Math.floor(G.t),Math.round(jf),r1(pfu),r1(pfd),Z.length,FX.length+G.fxl.length,PART.length,[perfFlags(),necroCnt()?'N':'',G.ev||'','eb'+EB.length,'b'+B.length].filter(Boolean).join('+')]);
  pfu=fu;pfd=fd;
}
function perfReport(n){
  const a=perfLoad().slice(-(n||3));
  if(!a.length)return 'ยังไม่มีข้อมูล เล่นสัก 1 รอบก่อน';
  let o='ZRUN-PERF v56 (เกม v56) (แสดง '+a.length+' รอบล่าสุด)\n';
  a.forEach((r,i)=>{
    o+='\n=== RUN '+(i+1)+' '+r.ch+' | '+r.map+' | '+r.df+' | '+r.mo+' | mob'+r.mob+' dpr'+r.dpr+' vp'+r.vp+' zbase'+r.zb+' | จบที่ '+r.end+'s'+(r.dun!==undefined?' | เข้าดันเจี้ยนที่ '+r.dun+'s':'')+'\n'+r.ua+'\n';
    const mins={};r.rows.forEach(w=>{const m=Math.floor(w[0]/60);(mins[m]=mins[m]||[]).push(w)});
    o+='[สรุปรายนาที] นาที: avg_ms / max_ms / min_fps / upd / drw / Zสูงสุด / capต่ำสุด / คุณภาพ\n';
    Object.keys(mins).forEach(m=>{
      const w=mins[m],n2=w.length,av=x=>w.reduce((t,q)=>t+q[x],0)/n2;
      o+=m+': '+av(2).toFixed(1)+' / '+Math.max(...w.map(q=>q[3]))+' / '+Math.min(...w.map(q=>q[1]))+' / '+av(4).toFixed(1)+' / '+av(5).toFixed(1)+' / '+Math.max(...w.map(q=>q[6]))+' / '+Math.min(...w.map(q=>q[7]))+' / '+(w.some(q=>q[12])?'LOW':'HIGH')+'\n';
    });
    o+='[แถวทุก 5 วินาที] t,fps,avg,max,upd,drw,Z,cap,fx,pt,tx,dc,low,eb,b,flags\n'+r.rows.map(w=>w.join(',')).join('\n')+'\n';
    o+='[เฟรมสะดุด n='+r.sp.length+'] t,ms,upd,drw,Z,fx,pt,flags\n'+r.sp.map(w=>w.join(',')).join('\n')+'\n';
  });
  return o;
}
function showPerf(){
  const a=perfLoad(),txt=perfReport(5).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  page('<h2 style="margin:0">📊 บันทึกประสิทธิภาพ</h2>'+
    '<div style="font-size:13px;color:#bcd;max-width:340px">เก็บอัตโนมัติทุกรอบ ('+a.length+'/5 รอบ) กดคัดลอกแล้ววางส่งในแชทได้เลย</div>'+
    '<textarea id="pft" readonly style="height:180px">'+txt+'</textarea>'+
    '<button class="big" data-a="pfcopy">📋 คัดลอก</button>'+
    '<button class="big sec" data-a="pfclear">🗑️ ล้างบันทึก</button>'+
    '<button class="big sec" data-a="set">← กลับ</button>');
}
addEventListener('pagehide',()=>{try{perfSave()}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)perfSave()});

function loop(now){
  const raw=Math.max(0,(now-last)/1000),dt=Math.min(.05,raw);last=now;  // v24: กันเวลาติดลบ (rAF timestamp ย้อน) ที่ทำให้ท่าเดิน/ellipse พัง
  if(state==='play')peakFrameMs=Math.max(peakFrameMs,raw*1000);
  if(state==='play'){
    const t0=performance.now();
    if(G.hstop>0){G.hstop-=raw;fu=0}else{update(dt);}
    const du=performance.now()-t0;upAcc+=du;if(G.hstop<=0)fu=du;
    // เฝ้าดู FPS: ถ้าตั้งเป็นอัตโนมัติและเฟรมเรตต่ำติดกัน 3 วินาที จะลดคุณภาพให้เอง
    fpsAcc+=raw;fpsN++;
    if(fpsAcc>=1){
      fps=Math.round(fpsN/fpsAcc);avgMs=fpsAcc*1000/fpsN;upMs=upAcc/fpsN;drMs=drAcc/fpsN;
      fpsAcc=0;fpsN=0;upAcc=0;drAcc=0;lastPeakFrameMs=peakFrameMs;peakFrameMs=0;
      // governor: เฟรมช้า/สะดุดต่อเนื่อง -> ลดเพดานซอมบี้ทีละ 10 ; เฟรมดีนานๆ -> ค่อยๆ คืนทีละ 5
      if(avgMs>20||lastPeakFrameMs>45){badCnt++;goodCnt=0}
      else if(avgMs<18&&lastPeakFrameMs<30){goodCnt++;badCnt=0}
      else{badCnt=0;goodCnt=0}
      if(badCnt>=2&&MAX_Z>Z_MIN){MAX_Z=Math.max(Z_MIN,MAX_Z-10);badCnt=0}
      else if(goodCnt>=12&&MAX_Z<Z_BASE){MAX_Z=Math.min(Z_BASE,MAX_Z+5);goodCnt=0}
      perfTick();
      if(S.q==='auto'&&!lowQ){lowCnt=(fps<45||lastPeakFrameMs>34)?lowCnt+1:0;if(lowCnt>=2){lowQ=true;applyDPR();G.ban={s:'⚙️ ลดคุณภาพกราฟิกอัตโนมัติ',t:2}}}
    }
  }
  if(state!=='menu'){const t1=performance.now();draw();fd=performance.now()-t1;if(state==='play'){drAcc+=fd;perfSpike(raw*1000)}}
  requestAnimationFrame(loop);
}
applyCustom();loadMapImgs();
if(!CHARS[S.sel])S.sel='soldier';
if(!MAPS[S.map]||!S.maps.includes(S.map))S.map='forest';
reset();
showMenu();
requestAnimationFrame(loop);
</script>
